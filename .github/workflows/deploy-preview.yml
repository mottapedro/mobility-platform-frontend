name: Deploy Preview

on:
  pull_request:
    branches: [main]

jobs:
  deploy-preview:
    name: Deploy to Vercel Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.PREVIEW_API_URL }}

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const body = `
            ## 🚀 Preview Deployment

            Your preview deployment is ready!

            🔗 **Preview URL**: https://mobility-platform-frontend-git-${{ github.head_ref }}-mottapedros-projects.vercel.app

            ---

            This preview will be automatically updated when you push new commits.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
