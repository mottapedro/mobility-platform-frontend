name: GODNETWORK Governance Suite

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [release]

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_API_URL: ${{ secrets.SMOKE_API_URL }}
      SMOKE_DRIVER_EMAIL: ${{ secrets.SMOKE_DRIVER_EMAIL }}
      SMOKE_DRIVER_PASSWORD: ${{ secrets.SMOKE_DRIVER_PASSWORD }}
      SMOKE_PASSENGER_EMAIL: ${{ secrets.SMOKE_PASSENGER_EMAIL }}
      SMOKE_PASSENGER_PASSWORD: ${{ secrets.SMOKE_PASSENGER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium chrome
      - name: Run GODNETWORK Governance Suite
        run: npm run test:e2e:godnetwork-governance
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
