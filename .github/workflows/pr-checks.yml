name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  db-governance-guard:
    name: DB Governance Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Block destructive DB operations in changed files
        shell: bash
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1

          CHANGED_FILES=$(git diff --name-only "$BASE_REF"...HEAD)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed files detected."
            exit 0
          fi

          PATTERN='(DROP[[:space:]]+DATABASE|prisma[[:space:]]+migrate[[:space:]]+reset|TRUNCATE[[:space:]]+TABLE|deleteMany\(\)|ALTER[[:space:]]+TYPE[[:space:]].*[[:space:]]ADD[[:space:]]+VALUE)'
          VIOLATIONS=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue

            if grep -Ein "$PATTERN" "$file" > /tmp/dbgov_hits.txt; then
              echo "::error file=$file::Potentially destructive DB command detected"
              cat /tmp/dbgov_hits.txt
              VIOLATIONS=1
            fi
          done <<< "$CHANGED_FILES"

          if [ "$VIOLATIONS" -ne 0 ]; then
            echo "DB governance guard failed."
            exit 1
          fi

          echo "DB governance guard passed."

  pr-info:
    name: PR Information
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get PR stats
        id: pr-stats
        run: |
          FILES_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | wc -l)
          LINES_ADDED=$(git diff --numstat origin/${{ github.base_ref }}...HEAD | awk '{sum+=$1} END {print sum}')
          LINES_REMOVED=$(git diff --numstat origin/${{ github.base_ref }}...HEAD | awk '{sum+=$2} END {print sum}')

          echo "files_changed=$FILES_CHANGED" >> $GITHUB_OUTPUT
          echo "lines_added=$LINES_ADDED" >> $GITHUB_OUTPUT
          echo "lines_removed=$LINES_REMOVED" >> $GITHUB_OUTPUT

      - name: Comment PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const filesChanged = '${{ steps.pr-stats.outputs.files_changed }}';
            const linesAdded = '${{ steps.pr-stats.outputs.lines_added }}';
            const linesRemoved = '${{ steps.pr-stats.outputs.lines_removed }}';

            const body = `
            ## 📊 PR Statistics

            - 📁 Files changed: **${filesChanged}**
            - ➕ Lines added: **${linesAdded}**
            - ➖ Lines removed: **${linesRemoved}**

            ---

            🤖 Automated checks are running...
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Analyze bundle size
        run: |
          echo "## 📦 Bundle Size" >> $GITHUB_STEP_SUMMARY
          du -sh .next/ >> $GITHUB_STEP_SUMMARY
